name: "Monthly Business Report"
cadence: monthly
version: "1.0"

output:
  format: markdown
  destination: terminal
  file_path: "Logs/Business/Monthly/{MONTH_YEAR}.md"

sections:
  - id: executive-summary
    title: "Executive Summary"
    type: executive-summary

  - id: monthly-kpis
    title: "Monthly KPIs"
    type: kpi-table
    compare: mom
    kpis:
      - name: "Revenue Invoiced"
        source: sherpa
        query: revenue_invoiced
      - name: "EBITDA"
        source: sherpa
        query: ebitda
      - name: "Profit Margin"
        source: sherpa
        query: profit_margin
      - name: "Cash in Bank"
        source: sherpa
        query: cash_balance
      - name: "Runway"
        source: sherpa
        query: runway_months
      - name: "New Business Pipeline"
        source: hubspot
        query: pipeline_total_value
      - name: "Accounts Receivable"
        source: sherpa
        query: accounts_receivable
      - name: "Accounts Payable"
        source: sherpa
        query: accounts_payable
      - name: "Client NPS"
        source: sheets
        query: client_nps
      - name: "Team NPS"
        source: sheets
        query: team_nps

  - id: management
    title: "Management Overview"
    type: notion-management
    source: notion
    databases:
      - challenges
      - headlines
      - opportunities
      - todos

  - id: commercial
    title: "Commercial"
    source: hubspot
    type: pipeline-detail
    metrics:
      - pipeline_stages
      - deals_won
      - deals_lost
      - win_rate
      - new_deals
      - active_proposals
      - calls
      - avg_deal_size

  - id: pipeline-movement
    title: "Pipeline Movement"
    source: hubspot
    type: pipeline-movement
    metrics:
      - som_value
      - eom_value
      - delta_value
      - som_count
      - eom_count
      - delta_count

  - id: weekly-breakdown
    title: "Weekly Breakdown"
    source: hubspot
    type: weekly-breakdown
    metrics:
      - pipeline_value
      - deals_won
      - deals_lost

  - id: hr-team
    title: "HR — Team"
    source: factorial
    type: hr-snapshot
    metrics:
      - headcount
      - som_headcount
      - headcount_delta
      - joiners
      - departures

  - id: hr-time-off
    title: "Time Off Summary"
    source: factorial
    type: time-off-summary
    metrics:
      - holiday_days
      - holiday_people
      - sick_days
      - sick_people
      - other_days
      - other_people

  - id: hr-staff
    title: "Staff Overview"
    source: factorial
    type: hr-snapshot
    metrics:
      - staff_table

  - id: hr-recruitment
    title: "HR — Recruitment"
    source: airtable
    type: recruitment-detail
    metrics:
      - open_positions
      - active_candidates
      - offers
      - hires
      - rejections
      - by_position
      - by_status
      - by_source
      - candidate_details

  - id: financial-pnl
    title: "Financial — P&L"
    source: sherpa
    type: pnl-summary
    compare: mom

  - id: financial-cash
    title: "Financial — Cash & Runway"
    source: sherpa
    type: cash-summary

  - id: marketing
    title: "Marketing"
    source: mailerlite
    type: stub
    note: "Pending MailerLite + GA + LinkedIn + YouTube integration (v2). Planned: Newsletter subscribers/opens, Website traffic, LinkedIn engagement, YouTube views"

  - id: operations
    title: "Operations"
    source: sheets
    type: stub
    note: "Pending spreadsheet integration (v2). Planned: Team Utilization, 30/60/90 Utilization, Resource Allocation, Opportunity Cost"

  - id: notes-and-actions
    title: "Notes & Actions"
    type: notes-and-actions
