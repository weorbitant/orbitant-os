<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!--
      CARD — a full-frame text card: the title, "what comes next", a figure, and the outro.
      Written by demo.mjs build: every double-brace token is replaced. the LOGO token is an <img>
      on the outro and empty elsewhere. Brand values come from :root in index.html.
      ENTER names the entrance, a recipe of the Afianza transition board (references/motion.md).
    -->
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: var(--font-body), sans-serif;
        }
        .{{ID}}-stage {
          position: absolute;
          inset: 0;
          background: radial-gradient(ellipse 1500px 950px at 50% 46%, var(--stage-hi) 0%, var(--stage) 55%, var(--stage-lo) 100%);
        }
        .{{ID}}-stack {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
          padding: 0 200px;
          text-align: center;
        }
        /* Start state for everything the timeline reveals: a tl.set at 0 does not
           render while the playhead sits exactly at 0. */
        .{{ID}}-logo,
        .{{ID}}-kicker,
        .{{ID}}-headline,
        .{{ID}}-sub {
          opacity: 0;
        }
        .{{ID}}-kicker:empty,
        .{{ID}}-headline:empty,
        .{{ID}}-sub:empty,
        .{{ID}}-line:has(> :empty) {
          display: none;
        }
        /* Each text line sits in its own clip, so "mask" can slide it up from behind its edge.
           The padding keeps descenders inside the clip. */
        .{{ID}}-line {
          overflow: hidden;
          padding-bottom: 0.12em;
          margin-bottom: -0.12em;
        }
        .{{ID}}-word {
          display: inline-block;
        }
        /* Entrances where text does not fade in: the start state is visible. */
        .enter-mask .{{ID}}-kicker, .enter-mask .{{ID}}-headline, .enter-mask .{{ID}}-sub,
        .enter-words .{{ID}}-headline,
        .enter-underline .{{ID}}-logo, .enter-underline .{{ID}}-kicker, .enter-underline .{{ID}}-headline, .enter-underline .{{ID}}-sub,
        .enter-handle .{{ID}}-sub {
          opacity: 1;
        }
        .enter-underline .{{ID}}-bar,
        .enter-handle .{{ID}}-bar,
        .enter-handle .{{ID}}-sub {
          clip-path: inset(0 100% 0 0);
        }
        .enter-words .{{ID}}-word,
        .enter-hold .{{ID}}-bar {
          opacity: 0;
        }
        /* "badge": the kicker is the release chip. */
        .enter-badge .{{ID}}-kicker {
          color: var(--accent-ink);
          background: var(--accent);
          border-radius: 100px;
          padding: 8px 26px;
          letter-spacing: 0.04em;
        }
        /* A figure: the number is the headline, its label the sub line. */
        .is-figure .{{ID}}-headline {
          font-size: 200px;
          line-height: 1;
          letter-spacing: -0.03em;
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }
        .is-figure .{{ID}}-sub {
          font-size: 44px;
        }
        .{{ID}}-logo {
          height: 110px;
          width: auto;
          margin-bottom: 20px;
        }
        .{{ID}}-kicker {
          font-family: var(--font-display), sans-serif;
          font-weight: var(--font-display-weight);
          font-size: 32px;
          letter-spacing: 0.06em;
          color: var(--accent-text);
        }
        .{{ID}}-bar {
          width: 120px;
          height: 6px;
          border-radius: 3px;
          background: var(--accent);
        }
        .{{ID}}-headline {
          font-family: var(--font-display), sans-serif;
          font-weight: var(--font-display-weight);
          font-size: 96px;
          line-height: 1.06;
          letter-spacing: -0.02em;
          color: var(--ink);
        }
        .{{ID}}-sub {
          font-size: 38px;
          font-weight: var(--font-body-weight);
          line-height: 1.4;
          color: var(--ink-muted);
        }
      </style>

      <div id="root" data-composition-id="{{ID}}" data-width="1920" data-height="1080">
        <div id="{{ID}}-stage" class="clip {{ID}}-stage" data-start="0" data-duration="{{DUR}}" data-track-index="0"></div>
        <!-- data-layout-allow-overlap: text meets the next scene's text only during a seam, by design. -->
        <div class="{{ID}}-stack {{CLASSES}}" data-layout-allow-overlap>
          {{LOGO}}
          <div class="{{ID}}-line"><div id="{{ID}}-kicker" class="{{ID}}-kicker">{{KICKER}}</div></div>
          <div id="{{ID}}-bar" class="{{ID}}-bar"></div>
          <div class="{{ID}}-line"><div id="{{ID}}-headline" class="{{ID}}-headline">{{HEADLINE}}</div></div>
          <div class="{{ID}}-line"><div id="{{ID}}-sub" class="{{ID}}-sub">{{SUB}}</div></div>
        </div>
      </div>

      <script>
        ;(() => {
          {{EASE}}
          const F = 1 / 30
          const tl = gsap.timeline({ paused: true })
          const $ = (n) => document.querySelector('#{{ID}}-' + n) && '#{{ID}}-' + n // GSAP warns on a missing target
          const go = (n, from, to, at) => $(n) && tl.fromTo($(n), from, { ...to, ease: EZ, immediateRender: false }, at)
          const fade = (n, at, f = 9) => go(n, { opacity: 0 }, { opacity: 1, duration: f * F }, at)
          const rise = (n, at, y = 14, f = 9) => go(n, { opacity: 0, y }, { opacity: 1, y: 0, duration: f * F }, at)
          const draw = (n, at, f) => go(n, { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: f * F }, at)
          const bar = (at) => go('bar', { scaleX: 0 }, { scaleX: 1, duration: 12 * F }, at)
          const A = 3 * F // every entrance starts a beat after the cut, past the seam

          const ENTER = {
            // O2 — headline first, then the lines around it, 2 frames apart.
            rise: () => { rise('logo', A); rise('headline', A + 2 * F); rise('kicker', A + 4 * F); bar(A + 4 * F); rise('sub', A + 6 * F) },
            // O3 — the headline word by word (five words at most).
            words: () => {
              rise('logo', A); rise('kicker', A); bar(A)
              tl.fromTo('.{{ID}}-word', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 7 * F, ease: EZ, stagger: 2 * F, immediateRender: false }, A + 4 * F)
              rise('sub', A + 16 * F)
            },
            // O11 — each line slides up from behind its own edge, no fade.
            mask: () => {
              rise('logo', A); bar(A)
              ;['kicker', 'headline', 'sub'].forEach((n, k) => go(n, { yPercent: 105 }, { yPercent: 0, duration: 10 * F }, A + k * 3 * F))
            },
            // O5 — the text is already there; only the accent rule draws.
            underline: () => draw('bar', A + 3 * F, 13),
            // O10 — the chip pops (two tweens: a monotonic ease cannot reach 1.12 and come back), then the headline.
            badge: () => {
              rise('logo', A)
              go('kicker', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1.12, duration: 5 * F }, A)
              $('kicker') && tl.to($('kicker'), { scale: 1, duration: 3 * F, ease: EZ }, A + 5 * F)
              bar(A + 2 * F)
              go('headline', { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 9 * F }, A + 4 * F)
              rise('sub', A + 8 * F)
            },
            // C12 — the mark settles, the lines fade in, then nothing moves.
            hold: () => {
              go('logo', { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 10 * F }, A)
              ;['kicker', 'bar', 'headline', 'sub'].forEach((n) => fade(n, A + 4 * F, 8))
            },
            // C7 — the rule draws, then the address wipes in under it. Text never moves.
            handle: () => {
              ;['logo', 'kicker', 'headline'].forEach((n) => fade(n, A, 10))
              draw('bar', A + 6 * F, 11)
              draw('sub', A + 12 * F, 10)
            },
            // O9 — the number lands, its label a beat later.
            figure: () => { rise('kicker', A); bar(A); rise('headline', A + 3 * F, 12, 10); rise('sub', A + 6 * F, 12, 10) },
          }
          ENTER['{{ENTER}}']()

          window.__timelines['{{ID}}'] = tl
        })()
      </script>
    </template>
  </body>
</html>
