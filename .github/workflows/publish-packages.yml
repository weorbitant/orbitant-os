name: Publish Packages

on:
  push:
    tags:
      - 'orbitant-*-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. orbitant-marketing-v1.5.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@weorbitant'

      - name: Install dependencies
        run: npm ci

      - name: Publish package for tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --import tsx scripts/publish-package.ts "${{ github.event.inputs.tag || github.ref_name }}"
