name: Publish Packages

on:
  push:
    tags:
      - 'orbitant-*-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. orbitant-marketing-v1.5.0)'
        required: true

permissions:
  contents: read
  id-token: write # OIDC token: the only credential this workflow has

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    steps:
      # Intentionally NO `ref:` here. On push:tags the tag's own commit is already checked out;
      # for workflow_dispatch we build from the default branch on purpose — some existing release
      # tags predate this build tooling, so checking them out would leave scripts/ missing.
      # The tag<->built-version guard in publish-package.ts covers version correctness.
      - uses: actions/checkout@v4

      # Node 24 for its bundled npm 11: trusted publishing needs npm >= 11.5.1 and Node >= 22.14.
      # Deliberately NO `registry-url` / `scope`: those make setup-node write an .npmrc with an
      # `_authToken=${NODE_AUTH_TOKEN}` line, and a configured (here, empty) credential is exactly
      # what stops npm from falling back to the OIDC exchange. The registry each package goes to
      # is pinned in its own generated package.json `publishConfig`.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # No npm token anywhere: npm authenticates by exchanging the workflow's OIDC token, so the
      # package must have this repo and this workflow filename registered as a trusted publisher
      # on npmjs.com before its first CI publish. A package that has never been published cannot
      # be configured there, so version one of each package is published by hand from a laptop.
      - name: Publish package for tag
        env:
          # Pass the tag through the environment instead of interpolating ${{ }} directly into the
          # run script — the GitHub-recommended way to avoid shell injection via a crafted ref name.
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          # Signed build attestation on npmjs.com, linking the published tarball to this workflow
          # run and commit. Trusted publishing is documented as generating it on its own, but that
          # has proven unreliable, so ask for it explicitly. Set as config rather than as a
          # `npm publish --provenance` flag so a local run of the same script, where there is no
          # OIDC token to attest with, does not fail.
          NPM_CONFIG_PROVENANCE: true
        run: node --import tsx scripts/publish-package.ts "$TAG"
