name: Validate Plugins

on:
  push:
    branches: [main, plugin-setup]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & validate
        run: npm run lint && npm run validate

      - name: Test
        run: npm run test

      - name: Build packages
        run: npm run build:packages
