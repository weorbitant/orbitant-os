name: Validate Plugins

on:
  push:
    branches: [main, plugin-setup]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & validate
        run: npm run lint && npm run validate

      - name: Test
        run: npm run test

      - name: Build packages
        run: npm run build:packages

      # The website parses plugins through the same shared module (scripts/lib/parse-plugin.ts);
      # run its parse step so a change that breaks the website adapter surfaces on the PR, not at deploy.
      - name: Website parse
        run: npm run website:parse
